<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technical Council — Placeholder Frontend</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main { max-width: 40rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { line-height: 1.6; color: #94a3b8; }
      code {
        background: #1e293b;
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        font-size: 0.9em;
      }
      #status {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        font-weight: 600;
        background: #334155;
      }
      #status.ok { background: #14532d; color: #bbf7d0; }
      #status.bad { background: #7f1d1d; color: #fecaca; }
      .note {
        margin-top: 2rem;
        font-size: 0.85rem;
        border-top: 1px solid #1e293b;
        padding-top: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Technical Council — API is running</h1>
      <p>
        This is a <strong>placeholder frontend</strong>. It exists so the deploy
        bundle can be built and so Express serves a valid SPA shell. Replace
        <code>frontend/</code> with the real React app.
      </p>
      <div id="status">checking /health…</div>
      <p class="note">
        API routes are live under <code>/api</code>. Try
        <code>GET /health</code> or <code>GET /api/events</code> (auth required).
      </p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
